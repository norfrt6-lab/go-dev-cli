version: 2

project_name: devx

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: devx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/norfrt6-lab/go-dev-cli/cmd.version={{.Version}}
      - -X github.com/norfrt6-lab/go-dev-cli/cmd.commit={{.ShortCommit}}
      - -X github.com/norfrt6-lab/go-dev-cli/cmd.buildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
